<!doctype html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8">
  <title>Hikmah Academia Publishing Institute (HAPI)</title>
  <meta name="description" content="Hikmah Academia Publishing Institute (HAPI) is an independent, international publisher of peer-reviewed, open-access journals and scholarly books.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="icon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#fbfaf6">
  <meta property="og:site_name" content="Hikmah Academia Publishing Institute">
  <meta property="og:title" content="Hikmah Academia Publishing Institute (HAPI)">
  <meta property="og:description" content="Peer-reviewed, open-access journals and scholarly books.">
  <meta property="og:image" content="img/hapi-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet">
  <style>
    /* Boot loader: inline so it paints before Angular, fonts or Tailwind load. */
    #app-loader {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #fbfaf6;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #app-loader.is-done { opacity: 0; visibility: hidden; }
    #app-loader img { width: 112px; height: auto; mix-blend-mode: multiply; animation: loader-breathe 2.4s ease-in-out infinite; }
    #app-loader .bar { position: relative; width: 132px; height: 2px; overflow: hidden; background: #e6dfd1; }
    #app-loader .bar::after {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 40%;
      background: #c9651a; animation: loader-slide 1.3s ease-in-out infinite;
    }
    #app-loader p {
      margin: 0; font: italic 15px/1.3 Georgia, "Times New Roman", serif; color: #5a3924; letter-spacing: .01em;
    }
    @keyframes loader-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes loader-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .78; } }
    @media (prefers-reduced-motion: reduce) {
      #app-loader img, #app-loader .bar::after { animation: none; }
    }
  </style>
</head>
<body class="min-h-full flex flex-col font-sans">
  <div id="app-loader" role="status" aria-live="polite">
    <img src="img/hapi-logo.jpg" alt="" width="112" height="120" />
    <div class="bar"></div>
    <p>Hikmah Academia Publishing Institute</p>
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading</span>
  </div>
  <app-root></app-root>
</body>
</html>
